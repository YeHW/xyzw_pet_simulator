[package]
name = "xyzw_pet_simulator"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "Monte Carlo simulator for XYZW pet merging"
license = "MIT"
repository = "https://github.com/YeHW/xyzw_pet_simulator"
readme = "README.md"
publish = false

[[bin]]
name = "xyzw-petsim"
path = "src/main.rs"

[dependencies]
rand = "0.10.2"
clap = { version = "4.5.16", features = ["derive"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
